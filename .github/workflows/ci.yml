name: CI

on:
  push:
    branches: [ main ]
  pull_request:
  # The release workflow runs these jobs for a tag.
  workflow_call:
    outputs:
      tested_on:
        description: The OpenWrt and Kea versions the target tests ran on
        value: ${{ jobs.target.outputs.tested_on }}

permissions:
  contents: read

# When another workflow calls this one, github.workflow is the name of the
# caller, so the two never cancel each other.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  OPENWRT_VERSION: 25.12.6
  OPENWRT_TARGET: x86/64

jobs:
  checks:
    name: Lint and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: JavaScript syntax
        run: find luci-app-kea/htdocs test -name '*.js' -exec node --check {} \;

      - name: Shell syntax
        run: |
          for file in test/*.sh tools/*.sh; do
            sh -n "$file"
          done

      - name: ShellCheck
        run: shellcheck test/*.sh tools/*.sh

      - name: Menu and ACL are valid JSON
        run: |
          jq -e . luci-app-kea/root/usr/share/luci/menu.d/luci-app-kea.json > /dev/null
          jq -e . luci-app-kea/root/usr/share/rpcd/acl.d/luci-app-kea.json > /dev/null

      # Each call is declared with "object" on one line and "method" on the
      # next. The pages call the backend of the application and, for the
      # nodes of a cluster, one method of another package.
      - name: Every RPC call of the pages is granted by the ACL, and nothing else is
        run: |
          grep -rhE '^[[:space:]]*(object|method): *"[A-Za-z.-]+"' luci-app-kea/htdocs \
            | sed -E 's/^[[:space:]]*(object|method): *"([^"]+)".*/\1 \2/' \
            | awk '$1 == "object" { object = $2 } $1 == "method" { print object, $2 }' | sort -u > used.txt
          jq -r '.["luci-app-kea"] | (.read.ubus, .write.ubus) | to_entries[] | .key as $object | .value[] | "\($object) \(.)"' \
            luci-app-kea/root/usr/share/rpcd/acl.d/luci-app-kea.json | sort -u > granted.txt
          diff used.txt granted.txt

      - name: ESLint
        run: npm run lint

      - name: Configuration model tests
        run: npm test

  package:
    name: Build with the OpenWrt SDK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential gawk gettext file libncurses-dev libssl-dev \
            python3-setuptools rsync swig unzip wget zlib1g-dev zstd

      - name: Download the SDK
        run: |
          base="https://downloads.openwrt.org/releases/$OPENWRT_VERSION/targets/$OPENWRT_TARGET"
          cd "$RUNNER_TEMP"
          curl -fsSLO "$base/sha256sums"
          sdk="$(grep -o 'openwrt-sdk-[^ ]*\.tar\.zst' sha256sums)"
          curl -fsSLO "$base/$sdk"
          grep -F "*$sdk" sha256sums | sha256sum -c -
          tar --zstd -xf "$sdk"
          mv "${sdk%.tar.zst}" sdk
          echo "SDK=$RUNNER_TEMP/sdk" >> "$GITHUB_ENV"

      # The repository is used the way the README tells users to: as a feed.
      - name: Prepare feeds
        working-directory: ${{ env.SDK }}
        run: |
          cp feeds.conf.default feeds.conf
          echo "src-link kea $GITHUB_WORKSPACE" >> feeds.conf
          ./scripts/feeds update base packages luci kea
          ./scripts/feeds install luci-app-kea
          test -L package/feeds/kea/luci-app-kea
          make defconfig

      - name: Check the package metadata
        working-directory: ${{ env.SDK }}
        run: |
          make --no-print-directory -r DUMP=1 TOPDIR="$PWD" INCLUDE_DIR="$PWD/include" \
            -C package/feeds/kea/luci-app-kea > "$RUNNER_TEMP/metadata.txt"
          cat "$RUNNER_TEMP/metadata.txt"
          grep -qx 'URL: https://github.com/woffko/luci-app-kea' "$RUNNER_TEMP/metadata.txt"
          grep -q '^Depends: .*+kea-uci' "$RUNNER_TEMP/metadata.txt"
          if grep -q 'OpenWrt LuCI community' "$RUNNER_TEMP/metadata.txt"; then
            echo "The package names the LuCI community as maintainer." >&2
            exit 1
          fi

      - name: Build host tools
        working-directory: ${{ env.SDK }}
        run: |
          make package/feeds/luci/luci-base/host/compile -j"$(nproc)"
          make package/feeds/base/ucode/host/compile -j"$(nproc)"

      - name: Backend library tests
        run: UCODE="$SDK/staging_dir/hostpkg/bin/ucode" test/run-ucode-tests.sh

      - name: Translation template is up to date
        run: |
          tools/update-pot.sh "$SDK/feeds/luci"
          git diff --exit-code -- luci-app-kea/po

      - name: Build the package
        working-directory: ${{ env.SDK }}
        run: make -C package/feeds/kea/luci-app-kea TOPDIR="$PWD" compile V=s

      - name: Collect the package
        run: |
          mkdir -p "$RUNNER_TEMP/out"
          cp "$SDK"/bin/packages/*/kea/luci-app-kea-*.apk "$RUNNER_TEMP/out/"
          ls -l "$RUNNER_TEMP/out"

      # A version without its section in the changelog cannot be released.
      - name: The release text can be made for this version
        run: |
          tag="$(tools/release-notes.sh --tag)"
          tools/release-notes.sh "$tag" "$RUNNER_TEMP"/out/luci-app-kea-*.apk
          if tools/release-notes.sh "$tag-wrong" > /dev/null 2>&1; then
            echo "A tag that does not fit the version was accepted." >&2
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: luci-app-kea
          path: ${{ runner.temp }}/out/*.apk
          if-no-files-found: error

  target:
    name: Tests on OpenWrt in QEMU
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      KEA_VM_DIR: ${{ github.workspace }}/.vm
      OUT_DIR: ${{ github.workspace }}/.screenshots
    outputs:
      tested_on: ${{ steps.report.outputs.tested_on }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Install the browser
        run: npx playwright install --with-deps chromium-headless-shell

      - name: Install QEMU
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system-x86 qemu-utils

      # Without this rule the runner user may not open /dev/kvm, and the
      # machine runs several times slower.
      - name: Allow the use of KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' |
            sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: actions/download-artifact@v4
        with:
          name: luci-app-kea
          path: ${{ runner.temp }}/package

      - name: Start OpenWrt, install Kea and the package
        run: |
          test/qemu-target.sh start "$OPENWRT_VERSION"
          test/qemu-target.sh setup "$RUNNER_TEMP"/package/luci-app-kea-*.apk

      - name: Backend and browser tests on the target
        run: test/run-target-tests.sh

      - name: Note what the tests ran on
        id: report
        run: |
          tested="$(test/qemu-target.sh ssh '. /etc/openwrt_release
            echo "OpenWrt $DISTRIB_RELEASE ($DISTRIB_ARCH) with Kea $(kea-dhcp4 -v)"')"
          echo "$tested"
          echo "tested_on=$tested" >> "$GITHUB_OUTPUT"

      - name: Keep the screenshots and the console of a failed run
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: target-test-failure
          path: |
            .screenshots/
            .vm/serial.log
          if-no-files-found: ignore
          include-hidden-files: true

      - name: Switch the machine off
        if: always()
        run: test/qemu-target.sh stop
