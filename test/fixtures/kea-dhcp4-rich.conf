// Test fixture written for luci-app-kea. It contains settings the
// structured DHCPv4 editor does not show, to prove that they survive a save.
{
"Dhcp4": {
	"interfaces-config": {
		"interfaces": [ "br-lan" ],
		"dhcp-socket-type": "raw"
	},
	"lease-database": {
		"type": "memfile",
		"lfc-interval": 3600
	},
	"renew-timer": 900,
	"rebind-timer": 1800,
	"valid-lifetime": 3600,
	"option-data": [
		{ "name": "domain-name-servers", "data": "192.168.1.1" }
	],
	"client-classes": [
		{
			"name": "printers",
			"test": "substring(option[60].hex,0,2) == 'HP'"
		}
	],
	"shared-networks": [
		{
			"name": "floor2",
			"relay": { "ip-addresses": [ "10.20.0.1" ] },
			"subnet4": [
				{
					"id": 7,
					"subnet": "10.20.0.0/24",
					"pools": [ { "pool": "10.20.0.10 - 10.20.0.50" } ]
				}
			]
		}
	],
	"subnet4": [
		{
			"id": 3,
			"subnet": "192.168.1.0/24",
			"interface": "br-lan",
			/* two pools, the first with a setting the editor does not show */
			"pools": [
				{
					"pool": "192.168.1.100 - 192.168.1.150",
					"option-data": [
						{ "name": "domain-name-servers", "data": "192.168.1.2" }
					]
				},
				{ "pool": "192.168.1.200 - 192.168.1.220" }
			],
			"valid-lifetime": 7200,
			"option-data": [
				{ "name": "routers", "data": "192.168.1.1" },
				{ "name": "domain-name-servers", "data": "192.168.1.1, 1.1.1.1", "always-send": true },
				{ "name": "ntp-servers", "data": "192.168.1.1" },
				{ "code": 15, "data": "lan" }
			],
			"user-context": { "site": "home" },
			"reservations": [
				{
					"hw-address": "02:00:00:00:00:01",
					"ip-address": "192.168.1.10",
					"hostname": "nas"
				},
				{
					"client-id": "01:02:00:00:00:00:02",
					"ip-address": "192.168.1.11",
					"option-data": [
						{ "name": "domain-name-servers", "data": "9.9.9.9" }
					]
				},
				{
					"flex-id": "'printer-1'",
					"ip-address": "192.168.1.12",
					"next-server": "192.168.1.5",
					"boot-file-name": "pxe.bin"
				}
			]
		},
		{
			# a relayed subnet without an interface, pool in prefix notation
			"id": 5,
			"subnet": "10.10.0.0/16",
			"pools": [ { "pool": "10.10.1.0/24" } ],
			"relay": { "ip-addresses": [ "10.10.0.1" ] }
		}
	],
	"loggers": [
		{
			"name": "kea-dhcp4",
			"output-options": [ { "output": "syslog" } ],
			"severity": "INFO"
		}
	]
}
}
