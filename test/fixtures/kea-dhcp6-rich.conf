// Test fixture written for luci-app-kea. It contains settings the
// structured DHCPv6 editor does not show, to prove that they survive a save.
{
"Dhcp6": {
	"interfaces-config": {
		"interfaces": [ "br-lan" ]
	},
	"lease-database": {
		"type": "memfile",
		"lfc-interval": 3600
	},
	"renew-timer": 1000,
	"rebind-timer": 2000,
	"preferred-lifetime": 3000,
	"valid-lifetime": 4000,
	"option-data": [
		{ "name": "dns-servers", "data": "fd00:1::1" }
	],
	"subnet6": [
		{
			"id": 2,
			"subnet": "fd00:1::/64",
			"interface": "br-lan",
			"pools": [
				{ "pool": "fd00:1::100 - fd00:1::1ff" },
				{ "pool": "fd00:1::1000/116" }
			],
			"pd-pools": [
				{
					"prefix": "fd00:1:0:100::",
					"prefix-len": 56,
					"delegated-len": 64,
					"excluded-prefix": "fd00:1:0:100::",
					"excluded-prefix-len": 72
				},
				{
					"prefix": "fd00:1:0:200::",
					"prefix-len": 56,
					"delegated-len": 60
				}
			],
			"rapid-commit": true,
			"preferred-lifetime": 1800,
			"option-data": [
				{ "name": "dns-servers", "data": "fd00:1::1, fd00:1::2" },
				{ "name": "sntp-servers", "data": "fd00:1::1" }
			],
			"reservations": [
				{
					"duid": "00:03:00:01:02:00:00:00:00:01",
					"ip-addresses": [ "fd00:1::10" ],
					"hostname": "nas"
				},
				{
					"hw-address": "02:00:00:00:00:02",
					"ip-addresses": [ "fd00:1::11", "fd00:1::12" ],
					"prefixes": [ "fd00:1:0:300::/64" ],
					"option-data": [
						{ "name": "dns-servers", "data": "fd00:1::53" }
					]
				},
				{
					"flex-id": "'cam-1'",
					"ip-addresses": [ "fd00:1::13" ]
				}
			]
		}
	],
	"loggers": [
		{
			"name": "kea-dhcp6",
			"output-options": [ { "output": "syslog" } ],
			"severity": "INFO"
		}
	]
}
}
